name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --bins
      - run: ./target/release/flexcontext benchmark benchmarks --max-bytes 12000 --output /tmp/retrieval.json
      - run: cargo bench --locked --bench pipeline -- --test
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-${{ matrix.os }}
          path: /tmp/retrieval.json
