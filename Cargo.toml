[package]
name = "flexcontext"
version = "0.0.1"
edition = "2024"
default-run = "flexcontext"
description = "Fast structural lexical context retrieval for coding agents"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
libc = "0.2"
ctrlc = "3.5"
rayon = "1.11"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-objc = "3.0"
tree-sitter-sfapex = "3.0"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-lua = "0.5"
tree-sitter-html = "0.23"
# Pin the CUDA grammar release validated with our Tree-sitter runtime.
tree-sitter-cuda = "=0.21.1"

[dev-dependencies]
criterion = "0.7"
tempfile = "3.20"

[[bench]]
name = "pipeline"
harness = false

[[bin]]
name = "flexcontext-bench"
path = "src/bin/flexcontext-bench.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
sha2 = "0.10"
